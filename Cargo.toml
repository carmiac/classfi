[package]
name = "classfi"
version = "0.2.1"
description = "Classical music in your terminal."
authors = ["Adam Milner <carmiac@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2024"
repository = "https://github.com/carmiac/classfi"
homepage = "https://github.com/carmiac/classfi"
keywords = ["tui", "music", "radio", "ratatui", "mpv"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.33"
ratatui = "0.30.2"
tokio = { version = "1.53.0", features = ["full"] }
tca-ratatui = "0.7.0"
url = "2.5.8"
radiobrowser = "0.6.1"
clap = { version = "4.6.2", features = ["derive", "cargo", "string"] }
libmpv2 = "6.0.0"
etcetera = "0.11.0"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.23"
anyhow = "1.0.103"
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = [
  "tracing",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
souvlaki = { version = "0.8.3", default-features = false, features = [
  "use_zbus",
] }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

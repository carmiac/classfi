[package]
name = "classfi"
version = "0.1.1"
description = "Classical music in your terminal."
authors = ["Adam Milner <carmiac@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2024"
repository = "https://github.com/carmiac/classfi"
homepage = "https://github.com/carmiac/classfi"
keywords = ["tui", "music", "radio", "ratatui", "mpv"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
ratatui = "0.30.0"
tokio = { version = "1.40.0", features = ["full"] }
tca-ratatui = "0.7.0"
url = "2.5.8"
radiobrowser = "0.6.1"
clap = { version = "4.6.0", features = ["derive", "cargo", "string"] }
libmpv2 = "5.0.3"
etcetera = "0.11.0"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.23"
anyhow = "1.0.102"
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = [
  "tracing",
] }

[build-dependencies]
vergen-gix = { version = "9.1.0", features = ["build", "cargo"] }
anyhow = "1.0.102"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

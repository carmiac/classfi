name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: classfi-aarch64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: classfi-x86_64-unknown-linux-gnu.tar.gz
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install libmpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libmpv-dev

      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv
          echo "C_INCLUDE_PATH=/opt/homebrew/include:$C_INCLUDE_PATH" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/opt/homebrew/lib:$LIBRARY_PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact }} classfi
          cd -

      - name: Upload release artifact
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}
          body: |
            ## Installation

            ### macOS (Apple Silicon)
            ```sh
            brew install mpv
            curl -Lo classfi.tar.gz https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/classfi-aarch64-apple-darwin.tar.gz
            tar -xzf classfi.tar.gz
            chmod +x classfi
            sudo mv classfi /usr/local/bin/
            ```

            ### Linux (x86_64)
            ```sh
            # Install mpv via your distro's package manager, e.g.:
            sudo apt install mpv        # Debian/Ubuntu
            sudo dnf install mpv        # Fedora
            sudo pacman -S mpv          # Arch

            curl -Lo classfi.tar.gz https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/classfi-x86_64-unknown-linux-gnu.tar.gz
            tar -xzf classfi.tar.gz
            chmod +x classfi
            sudo mv classfi /usr/local/bin/
            ```
          draft: false
          prerelease: false
